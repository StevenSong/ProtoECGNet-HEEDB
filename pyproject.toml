[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protoecgnet-heedb"
version = "0.1.0"
description = "ProtoECGNet on HEEDB, for the large user study"
authors = [{ name = "Steven Song" }]
requires-python = "==3.10.*"
# Exact versions are in uv.lock, constrained below to ProtoSSL's paper env.
dependencies = [
    "jsonargparse[signatures]",
    "lightning",
    "matplotlib",
    "numpy>=2.0.0",
    "omegaconf",
    "pandas",
    "pqdm",
    "pyarrow",  # parquet output of data-preprocessing/heedb_label_audit.py
    "scikit-learn",
    "scipy",
    "torch==2.7.0",
    "torchmetrics",
    "torchvision==0.22.0",
    "tqdm",
    "wandb",
    "wfdb==4.2.0",
]

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "pre-commit"]

[tool.uv]
required-version = "==0.13.7"  # keep in step with envs/install-uv.sh
python-preference = "only-managed"  # same uv-built CPython on every node, never conda/system
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
# Every locked package pinned to its version in ProtoSSL's paper env (conda env `protossl`,
# py3.10.19), the stack the v4 run was trained on. Regenerate from that env's `pip freeze`.
